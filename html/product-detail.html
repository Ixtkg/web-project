<html lang="th">
  <head>

    <script type="module">

        apiKey: "AIzaSyAJFpj7XaD63LLlLamhSr5FG9NfJjujZCU",
        authDomain: "web-project-aaf1d.firebaseapp.com",
        projectId: "web-project-aaf1d",
        storageBucket: "web-project-aaf1d.appspot.com",
        messagingSenderId: "304507208675",

      };

  </head>
  <body>
    <div id="modal-overlay" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <p id="modal-message"></p>
        <button onclick="closeModal()">ตกลง</button>
      </div>
    </div>

    <header class="main-header">
      <nav class="nav-bar">
        <div class="nav-content-centered">
          <a href="../html/1recommend_page1.html" class="logo">YOUR BRAND</a>
          <div class="nav-group nav-right">
            <a href="../html/2all_product_showing_page2.html">All Product</a>
            <a href="#" onclick="window.close()" style="color: #ff3b30">ปิดหน้าต่าง</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="product-detail-page">
      <div class="product-detail-container">
        <div class="product-detail-content" id="product-detail">
          <!-- รายละเอียดสินค้าจะถูกโหลดที่นี่ -->
          <p style="text-align: center; padding: 50px;">กำลังโหลด...</p>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <p>© 2025 YOUR BRAND. All rights reserved.</p>
    </footer>

  <script>
  let products = [];

  async function loadProducts() {
    const res = await fetch('../JS/products.json');
    products = await res.json();
  }

  window.addEventListener("DOMContentLoaded", async () => {
    await loadProducts();

    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get("id"));

    const product = products.find(p => p.id === productId);
    const productDetailDiv = document.getElementById("product-detail");

    if (!product) {
      productDetailDiv.innerHTML = `
        <div style ="text-align: center; padding: 50px;">
          <h2>ไม่พบสินค้า</h2>
          <p>ขออภัย ไม่พบสินค้าที่คุณค้นหา</p>
          <button onclick="window.close()" class="cta-button primary">ปิดหน้าต่าง</button>
        </div>
      `;
      return;
    }

    productDetailDiv.innerHTML = `
      <div>
        <img src="${product.image}" alt="${product.name}" class="product-detail-image" />
      </div>
      <div class="product-detail-info">
        <h1>${product.name}</h1>
        <p class="detail-category">${getCategoryName(product.category)}</p>
        <p class="detail-price">฿${product.price.toLocaleString()}</p>
        <p class="detail-description">${product.description}</p>
        
        <div class="quantity-selector">
          <label>จำนวน:</label>
          <button onclick="changeQuantity(-1)">-</button>
          <input type="number" id="quantity" value="1" min="1" max="99" readonly />
          <button onclick="changeQuantity(1)">+</button>
        </div>
        
        <button class="detail-add-to-cart" onclick="addToCartFromDetail()">
          เพิ่มลงตะกร้า
        </button>
      </div>
    `;
  });
</script>


    <script>
      // ฟังก์ชันแสดง Modal
      function showModal(message) {
        const modalOverlay = document.getElementById("modal-overlay");
        const modalMessage = document.getElementById("modal-message");
        modalMessage.textContent = message;
        modalOverlay.style.display = "flex";
      }

      window.closeModal = function () {
        document.getElementById("modal-overlay").style.display = "none";
      };


      function getCategoryName(category) {
        const categoryNames = {
          CookingEquipment: "อุปกรณ์ปรุงอาหาร",
          PreparationTools: "อุปกรณ์เตรียมอาหาร",
          Tableware: "ชุดรับประทานอาหาร",
          CleaningTools: "อุปกรณ์ทำความสะอาด",
          StorageEquipment: "อุปกรณ์จัดเก็บ"
        };
        return categoryNames[category] || category;
      }

      // ดึง product ID จาก URL
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get("id"));

      // ค้นหาสินค้า
      const product = products.find((p) => p.id === productId);

      const productDetailDiv = document.getElementById("product-detail");

      if (!product) {
        productDetailDiv.innerHTML = `
          <div style ="text-align: center; padding: 50px;">
            <h2>ไม่พบสินค้า</h2>
            <p>ขออภัย ไม่พบสินค้าที่คุณค้นหา</p>
            <button onclick="window.close()" class="cta-button primary">ปิดหน้าต่าง</button>
          </div>
        `;
      } else {
        // แสดงรายละเอียดสินค้า
        productDetailDiv.innerHTML = `
          <div>
            <img src="${product.image}" alt="${product.name}" class="product-detail-image" />
          </div>
          <div class="product-detail-info">
            <h1>${product.name}</h1>
            <p class="detail-category">${getCategoryName(product.category)}</p>
            <p class="detail-price">฿${product.price.toLocaleString()}</p>
            <p class="detail-description">${product.description}</p>
            
            <div class="quantity-selector">
              <label>จำนวน:</label>
              <button onclick="changeQuantity(-1)">-</button>
              <input type="number" id="quantity" value="1" min="1" max="99" readonly />
              <button onclick="changeQuantity(1)">+</button>
            </div>
            
            <button class="detail-add-to-cart" onclick="addToCartFromDetail()">
              เพิ่มลงตะกร้า
            </button>
          </div>
        `;
      }

      // เปลี่ยนจำนวน
      window.changeQuantity = function (change) {
        const quantityInput = document.getElementById("quantity");
        let currentValue = parseInt(quantityInput.value);
        currentValue += change;
        if (currentValue < 1) currentValue = 1;
        if (currentValue > 99) currentValue = 99;
        quantityInput.value = currentValue;
      };

      // เพิ่มลงตะกร้าจากหน้ารายละเอียด
      window.addToCartFromDetail = function () {
        const quantity = parseInt(document.getElementById("quantity").value);
        
        // ดึงตะกร้าจาก localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        // ตรวจสอบว่ามีสินค้านี้อยู่แล้วหรือไม่
        const existingItem = cart.find((item) => item.id === product.id);

        if (existingItem) {
          existingItem.quantity += quantity;
        } else {
          cart.push({
            ...product,
            quantity: quantity
          });
        }

        // บันทึกกลับไปที่ localStorage
        localStorage.setItem("cart", JSON.stringify(cart));

        showModal(`เพิ่ม "${product.name}" (${quantity} ชิ้น) ลงตะกร้าแล้ว`);
      };
    </script>
  </body>
</html>
