<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Product [ชื่อแบรน]</title>
    <link rel="stylesheet" href="../css/style.css" />

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import * as firebaseAuth from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAJFpj7XaD63LLlLamhSr5FG9NfJjujZCU",
        authDomain: "web-project-aaf1d.firebaseapp.com",
        projectId: "web-project-aaf1d",
        storageBucket: "web-project-aaf1d.appspot.com",
        messagingSenderId: "304507208675",
        appId: "1:304507208675:web:55add1cd6bf1d086b096d6",
        measurementId: "G-RKKQW9ZDDG",
      };

      const app = initializeApp(firebaseConfig);
      window.auth = firebaseAuth.getAuth(app);
      window.firebaseAuthFunctions = firebaseAuth;
    </script>
  </head>
  <body>

    <div id="modal-overlay" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <p id="modal-message"></p>
        <button onclick="closeModal()">ตกลง</button>
      </div>
    </div>

    <div id="main-page">
      <header class="main-header">
        <nav class="nav-bar">
          <div class="nav-content-centered">
            <a href="../html/1recommend_page1.html" class="logo">YOUR BRAND</a>

            <div class="nav-group nav-right">
              <a href="../html/2all_product_showing_page2.html">All Product</a>
              <a href="../html/3cookequip.html">CookingEquipment</a>
              <a href="../html/4preparetool.html">PreparationTools</a>
              <a href="../html/5tableware.html">Tableware</a>
              <a href="../html/6cleaningtool.html">CleaningTools</a>
              <a href="../html/7storageequip.html">StorageEquipment</a>

              <form class="search-form" onsubmit="event.preventDefault(); searchProduct();">
                <input
                  type="text"
                  id="search-input"
                  placeholder="ค้นหา..."
                  class="search-input"
                />
                <button type="submit" class="search-submit-btn">🔍</button>
              </form>
              <a href="#" class="nav-icon" id="cart-icon" onclick="toggleCart()">
                🛒
              <span class="cart-badge" id="cart-badge" style="display: none">0</span>
              </a>
              <a href="#login" class="nav-icon" id="login-icon">👤</a>
            </div>
          </div>
        </nav>
      </header>

      <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar">
      <div class="cart-header">
        <h2>ตะกร้าสินค้า</h2>
        <button class="close-cart-btn" onclick="toggleCart()">×</button>
      </div>
      <div class="cart-items" id="cart-items">
        <div class="empty-cart">ตะกร้าสินค้าว่างเปล่า</div>
      </div>
      <div class="cart-summary" id="cart-summary" style="display: none">
        <div class="cart-total">
          <span>ยอดรวม:</span>
          <span id="cart-total-price">฿0</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">ชำระเงิน</button>
      </div>
    </div>

      <main>
        <section class="product-grid-section">
          <h2>Tableware</h2>
          <div class="product-grid" id="product-grid">
            <!-- สินค้าจะถูกแสดงที่นี่โดย JavaScript -->
          </div>
        </section>
      </main>


      <footer class="main-footer">
        <p>© 2025 YOUR BRAND. All rights reserved.</p>
        <div class="footer-links">
          <a href="../html/Privacy_Policy.html">Privacy Policy</a>
          <a href="../html/Term_of_use.html">Terms of Use</a>
          <a href="../html/sale_refunds.html">Sales & Refunds</a>
        </div>
      </footer>
    </div>

    <!-- Auth -->
    <div id="auth-page" class="auth-page" style="display: none">
      <button class="back-button" onclick="goBackFromAuth()">← ย้อนกลับ</button>
      <div class="auth-container">
        <h2 id="auth-title">เข้าสู่ระบบ</h2>

        <div id="user-info" style="display: none">
          <p>ยินดีต้อนรับ: <span id="user-email-display"></span></p>
          <button onclick="window.logout()" class="cta-button secondary">
            ออกจากระบบ
          </button>
        </div>

        <div id="auth-form">
          <input type="email" id="email" placeholder="อีเมล" required /><br />
          <input
            type="password"
            id="password"
            placeholder="รหัสผ่าน"
            required
          /><br />

          <div class="auth-buttons">
            <button onclick="window.login()" class="cta-button primary">
              เข้าสู่ระบบ
            </button>
            <button onclick="window.signup()" class="cta-button secondary">
              สมัครสมาชิก
            </button>
          </div>
          <button onclick="window.resetPassword()" class="link-button">
            ลืมรหัสผ่าน?
          </button>
        </div>
      </div>
    </div>
    <script src="../JS/script.js"></script>
    <script src="../JS/products.js"></script>
    <script src="../JS/cart.js"></script>
  </body>
</html>
